name: Publish Laravel Website to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1: Checkout the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ✅ Step 2: Set up PHP
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo, curl, openssl

      # ✅ Step 3: Install Composer dependencies (including Livewire)
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # ✅ Step 4: Set up Node.js for Vite
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ✅ Step 5: Install Node dependencies and build frontend assets.
      - name: Install NPM dependencies
        run: npm install

      - name: Build assets with Vite
        run: npm run build

      # Bundle SIP.js into public/assets/vodnox/vendor/sip.min.js (IIFE that
      # exposes window.SIP). Built here because the cPanel host has no npm.
      - name: Build browser telephony bundle
        run: npm run build:telephony

      # ✅ Step 6: Deploy to cPanel via FTP 
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # NOTE: the Composer exclusion below must stay anchored to the
          # repository root. A depth-agnostic vendor glob ("**" + "/vendor/**")
          # also matched public/assets/vodnox/vendor/ and silently stripped the
          # SIP.js bundle from every deploy, which left the browser phone dead
          # with "SIP is not defined". Do not widen this pattern.
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            vendor/**
            **/tests/**
            .env
            .env.*
            phpunit.xml
