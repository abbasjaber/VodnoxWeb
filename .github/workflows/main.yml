name: Publish Laravel Website to cPanel

on:
  push:
    branches:
      - main

jobs:
  # Real behavioural test run. The deploy job below installs with --no-dev, so
  # PHPUnit is not even present there; a green FTP upload proves nothing about
  # the code. This job installs the dev dependencies, boots MySQL, and runs the
  # full PHPUnit suite. `deploy` depends on it, so a red suite blocks the
  # publish instead of shipping untested code to cPanel.
  tests:
    name: PHPUnit test suite
    runs-on: ubuntu-latest

    services:
      mysql:
        # Matches the MySQL major line the suite was verified against locally.
        image: mysql:9
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: vodnox_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      # Same PHP line as the deploy job so the suite is verified on the version
      # the release is built with. pdo_mysql is required by the test database.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo, pdo_mysql, curl, openssl

      # NOTE: no --no-dev here on purpose — phpunit lives in require-dev.
      - name: Install Composer dependencies (with dev)
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      # APP_KEY is required: gateway SIP secrets are encrypted casts, so the
      # suite cannot boot without an application key.
      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # phpunit.xml pins DB_CONNECTION=mysql / DB_DATABASE=vodnox_test, which
      # override the .env values; the service above provides that database.
      - name: Run PHPUnit
        run: vendor/bin/phpunit

  deploy:
    name: FTP Deploy to cPanel
    runs-on: ubuntu-latest
    needs: tests

    steps:
      # ✅ Step 1: Checkout the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ✅ Step 2: Set up PHP
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo, curl, openssl

      # ✅ Step 3: Install Composer dependencies (including Livewire)
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # ✅ Step 4: Set up Node.js for Vite
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ✅ Step 5: Install Node dependencies and build frontend assets.
      - name: Install NPM dependencies
        run: npm install

      - name: Build assets with Vite
        run: npm run build

      # Bundle SIP.js into public/assets/vodnox/vendor/sip.min.js (IIFE that
      # exposes window.SIP). Built here because the cPanel host has no npm.
      - name: Build browser telephony bundle
        run: npm run build:telephony

      # Behavioural test for the browser phone's microphone mute. It loads the
      # real public/assets/vodnox/telephony.js into a stubbed browser and drives
      # a call end to end: mute silences the live outgoing track, a SIP.js track
      # swap does not resurrect it, unmute restores it, and hanging up resets the
      # state. It also replays the same call with the fix removed and asserts the
      # bug comes back. Grepping the script for strings would prove none of this.
      - name: Browser phone mute tests
        run: node tests/js/telephony-mute.probe.mjs

      # Behavioural tests for the Certbot deploy hook. They run entirely inside
      # a temp fixture with a stub PATH: no root, no writes to the runner's
      # system directories, no network. `bash -n` alone is not enough here —
      # the guarantees under test are about modes, exit codes and rollback.
      - name: Telephony deploy-hook tests
        run: bash deploy/telephony/tests/certbot-deploy-hook.test.sh

      # Build the telephony release archive and fail if it would ship anything
      # secret-looking. It is written to the runner's temp directory, outside
      # the repository, so the FTP mirror below can never upload the tarball to
      # cPanel. The script also emits a .sha256 next to it.
      - name: Build telephony release package
        run: deploy/telephony/bin/package.sh "${RUNNER_TEMP}/vodnox-telephony-dist"

      # The archive is the artefact the operator installs on the Asterisk host.
      # CI never writes to /etc/asterisk, so this download is the handover.
      - name: Upload telephony agent package
        uses: actions/upload-artifact@v4
        with:
          name: vodnox-telephony-agent
          path: ${{ runner.temp }}/vodnox-telephony-dist/*
          if-no-files-found: error
          retention-days: 90

      # ✅ Step 6: Deploy to cPanel via FTP 
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # NOTE: the Composer exclusion below must stay anchored to the
          # repository root. A depth-agnostic vendor glob ("**" + "/vendor/**")
          # also matched public/assets/vodnox/vendor/ and silently stripped the
          # SIP.js bundle from every deploy, which left the browser phone dead
          # with "SIP is not defined". Do not widen this pattern.
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            vendor/**
            **/tests/**
            .env
            .env.*
            phpunit.xml
