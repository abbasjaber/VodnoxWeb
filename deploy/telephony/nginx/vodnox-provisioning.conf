# VODNOX telephony provisioning agent — reverse proxy.
#
# Install to /etc/nginx/sites-available/vodnox-provisioning and enable it.
# The application server calls this endpoint with a signed request; nothing
# else is exposed and no directory listing is possible.

server {
    listen 443 ssl http2;
    server_name pbx.vodnox.com;

    # Use the same trusted certificate as the WebSocket endpoint.
    ssl_certificate     /etc/asterisk/keys/pbx.vodnox.com.fullchain.pem;
    ssl_certificate_key /etc/asterisk/keys/pbx.vodnox.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Only the host that runs the Laravel application may reach this API.
    #
    # The allow-list lives in its own file because its value depends on the
    # application host's real egress address, which is discovered by the
    # requirements check (README §11) — never assumed. With no "allow" line the
    # "deny all" below closes the API completely, so the default is fail-closed.
    #
    # The signed requests (HMAC-SHA256) and HTTPS are the primary controls; this
    # list is defence in depth and must stay as narrow as that host allows.
    include /etc/nginx/vodnox-allow.conf;
    deny all;

    client_max_body_size 64k;
    server_tokens off;

    root /opt/vodnox-telephony/public;
    index index.php;

    location = / {
        return 404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Never serve the agent's own source or state.
    location ~ ^/(src|state)/ {
        return 403;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/vodnox-provisioning.sock;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }
}
