; ---------------------------------------------------------------------------
; VODNOX — PJSIP transport for the browser phone.
; ---------------------------------------------------------------------------
; Install as /etc/asterisk/vodnox/pjsip.conf and include it from pjsip.conf:
;
;     #include vodnox/pjsip.conf
;
; The generated per-extension endpoints live in vodnox/generated/*.conf and are
; written by the provisioning agent. Do not edit them by hand.
;
; UDP/5060 and TCP/5061 keep working for anything already using them; the
; browser phone registers over WebSocket (WS/WSS) handled by
; res_http_websocket + res_pjsip_transport_websocket. The TLS certificate and
; port for WSS are configured in http.conf, not here.
; ---------------------------------------------------------------------------

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

; Endpoints, auths and AORs generated per employee.
#include vodnox/generated/*.conf
