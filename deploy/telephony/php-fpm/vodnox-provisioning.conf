; VODNOX telephony provisioning agent — php-fpm pool.
; Install into this host's fpm configuration directory
; (for example /etc/php/<version>/fpm/vodnox-provisioning.conf — the version is
; whatever bin/install.sh detected, not necessarily 8.2) and start it through
; systemd/vodnox-provisioning.service.
;
; The pool runs as the Asterisk user on purpose: that gives the agent write
; access to /etc/asterisk/vodnox and permission to talk to the Asterisk
; console socket, with no sudo rule and no root shell anywhere.

[global]
pid = /run/vodnox-provisioning.pid
error_log = /var/log/vodnox-provisioning.log
daemonize = no

[vodnox]
user = asterisk
group = asterisk

listen = /run/vodnox-provisioning.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 200

; The document root is a dedicated directory, not the Asterisk config tree.
chdir = /opt/vodnox-telephony
php_admin_value[open_basedir] = /opt/vodnox-telephony:/etc/asterisk/vodnox:/var/lib/vodnox-telephony:/tmp
php_admin_value[disable_functions] = system,passthru,shell_exec,popen,proc_open,pcntl_exec,pcntl_fork,curl_exec,curl_multi_exec
php_admin_flag[allow_url_fopen] = off
php_admin_flag[expose_php] = off

; The agent is a plain request/response service; it must never serve a file.
security.limit_extensions = .php
